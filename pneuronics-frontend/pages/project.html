<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Project — Neuronix Learning</title>
<link rel="stylesheet" href="/js/theme.css?v=2">
<script src="/js/theme.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#0F1B2D;--bg-soft:#142337;--surface:#1C3050;--surface-2:#21385C;
  --line:rgba(241,238,230,.10);--line-strong:rgba(241,238,230,.18);
  --gold:#F4B740;--cyan:#5FD4D6;--green:#6FD18C;
  --text:#F3F1EA;--text-dim:#C8D3E3;--muted:#8AA0BD;
  --code-bg:#0A1322;--code-fg:#DCE6F5;
  --font-display:'Space Grotesk',sans-serif;--font-body:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;
}
html[data-theme="light"]{--code-bg:#F1EDFF;--code-fg:#1A1446;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text-dim);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;}
a{color:var(--cyan);text-decoration:none;}a:hover{text-decoration:underline;}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:.7rem 1.2rem;display:flex;align-items:center;gap:.7rem;font-size:.85rem;flex-wrap:wrap;}
.topbar .sep{color:var(--muted);}
.topbar .current{color:var(--text);font-weight:600;}
.wrap{display:flex;gap:2rem;max-width:1180px;margin:0 auto;padding:1.5rem 1.2rem 4rem;}
.toc{width:250px;flex-shrink:0;position:sticky;top:64px;align-self:flex-start;max-height:calc(100vh - 80px);overflow:auto;font-size:.82rem;}
.toc-title{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;}
.toc a{display:block;color:var(--text-dim);padding:.28rem .6rem;border-left:2px solid var(--line);line-height:1.35;}
.toc a:hover{color:var(--cyan);border-left-color:var(--cyan);text-decoration:none;}
.doc{flex:1;min-width:0;max-width:820px;}
.doc h1{font-family:var(--font-display);font-size:2rem;color:var(--text);line-height:1.2;margin:0 0 .8rem;}
.doc h2{font-family:var(--font-display);font-size:1.4rem;color:var(--text);margin:2.4rem 0 .8rem;padding-top:1rem;border-top:1px solid var(--line);}
.doc h3{font-family:var(--font-display);font-size:1.1rem;color:var(--gold);margin:1.6rem 0 .5rem;}
.doc p{margin:.7rem 0;}
.doc ul,.doc ol{margin:.7rem 0 .7rem 1.4rem;}
.doc li{margin:.25rem 0;}
.doc strong{color:var(--text);}
.doc blockquote{border-left:3px solid var(--gold);background:var(--surface);padding:.6rem 1rem;margin:1rem 0;border-radius:0 8px 8px 0;}
.doc code{font-family:var(--font-mono);font-size:.86em;background:var(--surface);padding:.1rem .35rem;border-radius:5px;color:var(--text);}
.doc pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;overflow:auto;margin:1rem 0;}
.doc pre code{background:none;padding:0;font-size:.82rem;line-height:1.55;color:var(--code-fg);}
.doc table{border-collapse:collapse;margin:1rem 0;display:block;overflow-x:auto;}
.doc th,.doc td{border:1px solid var(--line-strong);padding:.45rem .7rem;text-align:left;font-size:.9rem;}
.doc th{background:var(--surface);color:var(--text);}
.bl-code-wrap{border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.08);margin:1.1rem 0;}
.bl-code-bar{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;background:rgba(0,0,0,.3);}
.bl-dots{display:flex;gap:5px;}.bl-dots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15);}
.bl-dots span:first-child{background:#ff5f56;}.bl-dots span:nth-child(2){background:#ffbd2e;}.bl-dots span:last-child{background:#27c93f;}
.bl-fname{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);flex:1;}
.bl-copy{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);font-family:var(--font-mono);font-size:.7rem;padding:.2rem .6rem;border-radius:5px;cursor:pointer;transition:all .15s;}
.bl-copy:hover{background:rgba(95,212,214,.15);color:var(--cyan);}
.bl-code{margin:0;padding:1rem;overflow-x:auto;font-family:var(--font-mono);font-size:.82rem;line-height:1.65;color:#e2dfd6;background:rgba(0,0,0,.25);white-space:pre;}
.bl-code .kw{color:#ff79c6;font-weight:600;}
.bl-code .fn{color:#50fa7b;}
.bl-code .nm{color:#bd93f9;}
.bl-code .st{color:#f1fa8c;}
.bl-code .cm{color:#6272a4;font-style:italic;}
html[data-theme="light"] .bl-copy{background:#fff;border-color:#D5DCE6;color:#4A5568;}
html[data-theme="light"] .bl-dots span:not(:first-child):not(:nth-child(2)):not(:last-child){background:#CBD5E1;}
.note{margin-top:2.5rem;padding:1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:.88rem;}
.err{padding:2rem;text-align:center;color:var(--text);}
@media(max-width:860px){.toc{display:none;}.wrap{padding:1rem 1rem 3rem;}}
</style>
</head>
<body>
<nav class="topbar">
  <a href="dashboard.html">Dashboard</a><span class="sep">/</span>
  <a href="dashboard.html?tab=projects">Projects</a><span class="sep">/</span>
  <span class="current" id="bcTitle">Loading…</span>
  <div class="topbar-right" style="margin-left:auto;display:flex;align-items:center;gap:.5rem;"></div>
</nav>
<div class="wrap">
  <aside class="toc"><div class="toc-title">On this page</div><div id="toc"></div></aside>
  <main class="doc" id="doc"><div class="err">Loading project…</div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const FILES = {
  1: 'Project_1_House_Price_Prediction.ipynb',
  2: 'Project_2_Plant_Disease_Detection.ipynb',
  3: 'Project_3_Sentiment_Analysis.ipynb',
  4: 'Project_4_Handwritten_Digit_Recognition.ipynb',
  5: 'Project_5_AI_PDF_Chatbot.ipynb',
  readme: 'README.md',
  guide: 'Student_Project_Guide.md'
};
const n = new URLSearchParams(location.search).get('p');
const doc = document.getElementById('doc');
function esc(s){return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function highlightPython(raw){
  var KW=new Set(['def','class','return','import','from','for','while','if','elif','else','in','not','and','or','is','None','True','False','lambda','with','as','try','except','finally','raise','yield','assert','break','continue','pass','global','nonlocal','del','async','await']);
  var BI=new Set(['print','len','range','sum','zip','enumerate','list','dict','set','tuple','int','float','str','bool','abs','min','max','sorted','map','filter','open','super','isinstance','type','self']);
  function he(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function hlLine(line){
    var comment='',code=line,inQ=false,q='';
    for(var ci=0;ci<line.length;ci++){
      var ch=line[ci];
      if(inQ){if(ch===q)inQ=false;continue;}
      if(ch==='"'||ch==="'"){inQ=true;q=ch;continue;}
      if(ch==='#'){comment=line.slice(ci);code=line.slice(0,ci);break;}
    }
    var out='',tok=/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([0-9]+\.?[0-9]*)|([A-Za-z_][A-Za-z_0-9]*)|([^A-Za-z_0-9"'\n]+)/g,m;
    while((m=tok.exec(code))!==null){
      if(m[1]){out+='<span class="st">'+he(m[1])+'</span>';}
      else if(m[2]){out+='<span class="nm">'+he(m[2])+'</span>';}
      else if(m[3]){var w=m[3];out+=KW.has(w)?'<span class="kw">'+w+'</span>':BI.has(w)?'<span class="fn">'+w+'</span>':he(w);}
      else{out+=he(m[4]||m[0]);}
    }
    if(comment)out+='<span class="cm">'+he(comment)+'</span>';
    return out;
  }
  return raw.split('\n').map(hlLine).join('\n');
}

if (!FILES[n]) {
  doc.innerHTML = '<div class="err">Project not found. <a href="dashboard.html?tab=projects">Back to Projects</a></div>';
} else {
  const isMd = FILES[n].endsWith('.md');
  fetch('../projects/' + FILES[n]).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return isMd ? r.text() : r.json(); }).then(nb => {
    if (isMd) nb = {cells: [{cell_type: 'markdown', source: nb}]};
    let html = '';
    nb.cells.forEach(c => {
      const src = Array.isArray(c.source) ? c.source.join('') : (c.source || '');
      if (c.cell_type === 'markdown') {
        html += (window.marked ? marked.parse(src) : '<p>' + esc(src) + '</p>');
      } else if (c.cell_type === 'code') {
        html += '<div class="bl-code-wrap"><div class="bl-code-bar"><div class="bl-dots"><span></span><span></span><span></span></div><span class="bl-fname">code.py</span><button class="bl-copy" type="button">📋 Copy</button></div><pre class="bl-code">' + highlightPython(src) + '</pre></div>';
      }
    });
    if (!isMd) html += '<div class="note">This project is a reading copy with code only; outputs appear when you run the code yourself. You can copy each code block into Google Colab, Jupyter or your own Python setup. Educational use only.</div>';
    doc.innerHTML = html;

    const h1 = doc.querySelector('h1');
    const title = h1 ? h1.textContent.replace(/^\d+\.\s*/, '') : 'Project';
    document.getElementById('bcTitle').textContent = title;
    document.title = title + ' — Neuronix Learning';

    const toc = document.getElementById('toc');
    doc.querySelectorAll('h2').forEach((h, i) => {
      h.id = 'sec' + i;
      const a = document.createElement('a'); a.href = '#sec' + i; a.textContent = h.textContent;
      toc.appendChild(a);
    });
    doc.querySelectorAll('.bl-copy').forEach(b => b.addEventListener('click', () => {
      const pre = b.closest('.bl-code-wrap').querySelector('pre');
      const done = () => { b.textContent = 'Copied!'; setTimeout(() => b.textContent = '📋 Copy', 1500); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); try { document.execCommand('copy'); done(); } catch (e) { b.textContent = 'Press Ctrl+C'; } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(pre.innerText).then(done, fallback); else fallback();
    }));
  }).catch(e => { doc.innerHTML = '<div class="err">Could not load this project (' + esc(String(e.message || e)) + '). <a href="dashboard.html?tab=projects">Back to Projects</a></div>'; });
}
</script>
</body>
</html>
