<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Project — Neuronix Learning</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#0F1B2D;--bg-soft:#142337;--surface:#1C3050;--surface-2:#21385C;
  --line:rgba(241,238,230,.10);--line-strong:rgba(241,238,230,.18);
  --gold:#F4B740;--cyan:#5FD4D6;--green:#6FD18C;
  --text:#F3F1EA;--text-dim:#C8D3E3;--muted:#8AA0BD;
  --font-display:'Space Grotesk',sans-serif;--font-body:'IBM Plex Sans',sans-serif;--font-mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text-dim);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;}
a{color:var(--cyan);text-decoration:none;}a:hover{text-decoration:underline;}
.topbar{position:sticky;top:0;z-index:10;background:rgba(15,27,45,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:.7rem 1.2rem;display:flex;align-items:center;gap:.7rem;font-size:.85rem;flex-wrap:wrap;}
.topbar .sep{color:var(--muted);}
.topbar .current{color:var(--text);font-weight:600;}
.wrap{display:flex;gap:2rem;max-width:1180px;margin:0 auto;padding:1.5rem 1.2rem 4rem;}
.toc{width:250px;flex-shrink:0;position:sticky;top:64px;align-self:flex-start;max-height:calc(100vh - 80px);overflow:auto;font-size:.82rem;}
.toc-title{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;}
.toc a{display:block;color:var(--text-dim);padding:.28rem .6rem;border-left:2px solid var(--line);line-height:1.35;}
.toc a:hover{color:var(--cyan);border-left-color:var(--cyan);text-decoration:none;}
.doc{flex:1;min-width:0;max-width:820px;}
.doc h1{font-family:var(--font-display);font-size:2rem;color:var(--text);line-height:1.2;margin:0 0 .8rem;}
.doc h2{font-family:var(--font-display);font-size:1.4rem;color:var(--text);margin:2.4rem 0 .8rem;padding-top:1rem;border-top:1px solid var(--line);}
.doc h3{font-family:var(--font-display);font-size:1.1rem;color:var(--gold);margin:1.6rem 0 .5rem;}
.doc p{margin:.7rem 0;}
.doc ul,.doc ol{margin:.7rem 0 .7rem 1.4rem;}
.doc li{margin:.25rem 0;}
.doc strong{color:var(--text);}
.doc blockquote{border-left:3px solid var(--gold);background:var(--surface);padding:.6rem 1rem;margin:1rem 0;border-radius:0 8px 8px 0;}
.doc code{font-family:var(--font-mono);font-size:.86em;background:var(--surface);padding:.1rem .35rem;border-radius:5px;color:var(--text);}
.doc pre{background:#0A1322;border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;overflow:auto;margin:1rem 0;}
.doc pre code{background:none;padding:0;font-size:.82rem;line-height:1.55;color:#DCE6F5;}
.doc table{border-collapse:collapse;margin:1rem 0;display:block;overflow-x:auto;}
.doc th,.doc td{border:1px solid var(--line-strong);padding:.45rem .7rem;text-align:left;font-size:.9rem;}
.doc th{background:var(--surface);color:var(--text);}
.codewrap{position:relative;margin:1rem 0;}
.codewrap .lbl{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:.3rem;}
.codewrap pre{margin:0;}
.copy{position:absolute;top:1.4rem;right:.5rem;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--line-strong);border-radius:6px;padding:.2rem .55rem;font-size:.7rem;font-family:var(--font-mono);cursor:pointer;}
.copy:hover{color:var(--cyan);}
.note{margin-top:2.5rem;padding:1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:.88rem;}
.err{padding:2rem;text-align:center;color:var(--text);}
@media(max-width:860px){.toc{display:none;}.wrap{padding:1rem 1rem 3rem;}}
</style>
</head>
<body>
<nav class="topbar">
  <a href="dashboard.html">Dashboard</a><span class="sep">/</span>
  <a href="dashboard.html?tab=projects">Projects</a><span class="sep">/</span>
  <span class="current" id="bcTitle">Loading…</span>
</nav>
<div class="wrap">
  <aside class="toc"><div class="toc-title">On this page</div><div id="toc"></div></aside>
  <main class="doc" id="doc"><div class="err">Loading project…</div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const FILES = {
  1: 'Project_1_House_Price_Prediction.ipynb',
  2: 'Project_2_Plant_Disease_Detection.ipynb',
  3: 'Project_3_Sentiment_Analysis.ipynb',
  4: 'Project_4_Handwritten_Digit_Recognition.ipynb',
  5: 'Project_5_AI_PDF_Chatbot.ipynb',
  readme: 'README.md',
  guide: 'Student_Project_Guide.md'
};
const n = new URLSearchParams(location.search).get('p');
const doc = document.getElementById('doc');
function esc(s){return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function stripMagic(src){ return src; }

if (!FILES[n]) {
  doc.innerHTML = '<div class="err">Project not found. <a href="dashboard.html?tab=projects">Back to Projects</a></div>';
} else {
  const isMd = FILES[n].endsWith('.md');
  fetch('../projects/' + FILES[n]).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return isMd ? r.text() : r.json(); }).then(nb => {
    if (isMd) nb = {cells: [{cell_type: 'markdown', source: nb}]};
    let html = '';
    nb.cells.forEach(c => {
      const src = Array.isArray(c.source) ? c.source.join('') : (c.source || '');
      if (c.cell_type === 'markdown') {
        html += (window.marked ? marked.parse(src) : '<p>' + esc(src) + '</p>');
      } else if (c.cell_type === 'code') {
        html += '<div class="codewrap"><div class="lbl">Python code</div><button class="copy" type="button">Copy</button><pre><code>' + esc(src) + '</code></pre></div>';
      }
    });
    if (!isMd) html += '<div class="note">This project is a reading copy with code only; outputs appear when you run the code yourself. You can copy each code block into Google Colab, Jupyter or your own Python setup. Educational use only.</div>';
    doc.innerHTML = html;

    const h1 = doc.querySelector('h1');
    const title = h1 ? h1.textContent.replace(/^\d+\.\s*/, '') : 'Project';
    document.getElementById('bcTitle').textContent = title;
    document.title = title + ' — Neuronix Learning';

    const toc = document.getElementById('toc');
    doc.querySelectorAll('h2').forEach((h, i) => {
      h.id = 'sec' + i;
      const a = document.createElement('a'); a.href = '#sec' + i; a.textContent = h.textContent;
      toc.appendChild(a);
    });
    doc.querySelectorAll('.copy').forEach(b => b.addEventListener('click', () => {
      const t = b.parentElement.querySelector('code').textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
        () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); },
        () => { b.textContent = 'Press Ctrl+C'; const r = document.createRange(); r.selectNodeContents(b.parentElement.querySelector('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
    }));
  }).catch(e => { doc.innerHTML = '<div class="err">Could not load this project (' + esc(String(e.message || e)) + '). <a href="dashboard.html?tab=projects">Back to Projects</a></div>'; });
}
</script>
</body>
</html>
