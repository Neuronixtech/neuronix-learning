<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lesson Builder — Neuronix Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0B1018;--bg-soft:#111928;--surface:#161F31;--surface-2:#1C2740;
  --line:rgba(241,238,230,0.09);--line-strong:rgba(241,238,230,0.16);
  --gold:#F4B740;--cyan:#5FD4D6;--violet:#6C5CE7;
  --text:#F3F1EA;--dim:#C2CCDC;--muted:#7C8CA6;
  --mono:'IBM Plex Mono',monospace;--disp:'Space Grotesk',sans-serif;--body:'IBM Plex Sans',sans-serif;--kn:'Noto Sans Kannada',sans-serif;
}
body{background:var(--bg);color:var(--dim);font-family:var(--body);font-size:14px;line-height:1.6;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.5rem;background:var(--bg-soft);border-bottom:1px solid var(--line);flex-shrink:0;gap:1rem;}
.tb-left{display:flex;align-items:center;gap:1rem;}
.tb-logo{display:flex;align-items:center;gap:.55rem;}
.tb-logo svg{width:22px;height:22px;color:var(--gold);}
.tb-logo-text{font-family:var(--disp);font-weight:700;font-size:.9rem;color:var(--text);}
.tb-title{font-family:var(--disp);font-weight:600;font-size:.95rem;color:var(--text);padding-left:1rem;border-left:1px solid var(--line);}
.tb-right{display:flex;align-items:center;gap:.7rem;}
.btn{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--disp);font-weight:600;font-size:.82rem;padding:.5rem 1.05rem;border-radius:8px;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--gold);color:#0B1018;}.btn-primary:hover{opacity:.88;}
.btn-outline{background:transparent;color:var(--dim);border:1px solid var(--line-strong);}.btn-outline:hover{background:var(--surface);color:var(--text);}
.btn-danger{background:transparent;color:#ff6b6b;border:1px solid rgba(255,107,107,.4);}.btn-danger:hover{background:rgba(255,107,107,.14);border-color:#ff6b6b;}
.lang-toggle{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px;}
.lt-btn{font-size:.8rem;font-weight:600;font-family:var(--disp);color:var(--muted);background:transparent;border:none;border-radius:6px;padding:.35rem .8rem;cursor:pointer;transition:all .15s;}
.lt-btn.kn{font-family:var(--kn);}
.lt-btn.active{background:var(--cyan);color:#0B1018;}
.lt-btn.kn.active{background:var(--gold);color:#0B1018;}
.workspace{flex:1;display:grid;grid-template-columns:240px 1fr 420px;overflow:hidden;}
@media(max-width:1300px){.workspace{grid-template-columns:210px 1fr 360px;}}
.palette{background:var(--bg-soft);border-right:1px solid var(--line);overflow-y:auto;padding:1rem;}
.palette-title{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.85rem;}
.palette-hint{font-size:.72rem;color:var(--muted);margin-bottom:1rem;line-height:1.5;}
.block-card{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:.7rem .85rem;margin-bottom:.5rem;cursor:grab;transition:all .15s;user-select:none;}
.block-card:hover{border-color:var(--cyan);background:var(--surface-2);transform:translateX(2px);}
.block-card:active{cursor:grabbing;}
.block-card.dragging{opacity:.4;}
.bc-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.bc-body{flex:1;min-width:0;}
.bc-name{font-size:.82rem;font-weight:600;color:var(--text);}
.bc-desc{font-size:.68rem;color:var(--muted);line-height:1.3;}
.canvas{overflow-y:auto;padding:1.5rem;background:var(--bg);}
.canvas-inner{max-width:680px;margin:0 auto;}
.meta-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:1.1rem;margin-bottom:1.25rem;}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
.fg{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.7rem;}
.fg:last-child{margin-bottom:0;}
.fg label{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.fg-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;}
.link-mini{background:rgba(95,212,214,.1);border:1px solid rgba(95,212,214,.28);color:var(--cyan);font-size:.66rem;font-weight:600;letter-spacing:.04em;padding:.2rem .55rem;border-radius:6px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.25rem;text-transform:none;}
.link-mini:hover{background:rgba(95,212,214,.2);border-color:var(--cyan);}
.fi,.fs,.ft{background:var(--bg-soft);border:1px solid var(--line-strong);border-radius:8px;padding:.55rem .8rem;color:var(--text);font-size:.86rem;font-family:var(--body);width:100%;transition:border-color .15s;}
.fi:focus,.fs:focus,.ft:focus{outline:none;border-color:var(--cyan);}
.ft{resize:vertical;min-height:70px;line-height:1.6;}
.ft.kn,.fi.kn{font-family:var(--kn);}
.ft.code{font-family:var(--mono);font-size:.8rem;min-height:160px;background:#080f1c;color:#d4d0c8;}
.dropzone{min-height:120px;border:2px dashed var(--line-strong);border-radius:14px;padding:1rem;transition:all .15s;}
.dropzone.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);min-height:200px;}
.dropzone.dragover{border-color:var(--cyan);background:rgba(95,212,214,.04);}
.dz-icon{font-size:32px;margin-bottom:.5rem;opacity:.5;}
.dz-text{font-size:.85rem;}
.dz-sub{font-size:.72rem;margin-top:.25rem;}
.lblock{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;margin-bottom:.85rem;overflow:hidden;transition:border-top .1s,border-bottom .1s;}
.lblock.dragging{opacity:.4;}
.lblock.drop-before{border-top:3px solid var(--cyan);}
.lblock.drop-after{border-bottom:3px solid var(--cyan);}
.lblock-head{display:flex;align-items:center;gap:.6rem;padding:.6rem .85rem;background:var(--bg-soft);border-bottom:1px solid var(--line);cursor:grab;}
.lblock-head:active{cursor:grabbing;}
.lblock-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.lblock-name{font-family:var(--disp);font-weight:600;font-size:.82rem;color:var(--text);flex:1;}
.lblock-actions{display:flex;gap:.3rem;}
.lblock-btn{width:26px;height:26px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:11px;}
.lblock-btn:hover{background:var(--surface-2);color:var(--text);}
.lblock-btn.del:hover{background:rgba(255,80,80,.15);color:#ff6b6b;}
.lblock-body{padding:.9rem;display:flex;flex-direction:column;gap:.6rem;}
.drag-handle{color:var(--muted);cursor:grab;font-size:14px;}
.mini-label{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
.preview{background:var(--bg-soft);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
.preview-head{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;border-bottom:1px solid var(--line);flex-shrink:0;}
.preview-label{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.preview-frame{flex:1;border:none;width:100%;background:#0F1B2D;}
.ic-prob{background:rgba(95,212,214,.15);color:var(--cyan);}
.ic-math{background:rgba(95,212,214,.12);color:var(--cyan);}
.ic-concept{background:rgba(108,92,231,.18);color:#c4baf8;}
.ic-code{background:rgba(244,183,64,.15);color:var(--gold);}
.ic-output{background:rgba(40,202,66,.13);color:#28ca42;}
.ic-method{background:rgba(108,92,231,.15);color:#c4baf8;}
.ic-example{background:rgba(244,183,64,.13);color:var(--gold);}
.ic-artifact{background:rgba(108,92,231,.2);color:#c4baf8;}
.ic-links{background:rgba(95,212,214,.14);color:var(--cyan);}
.ic-heading{background:rgba(241,238,230,.1);color:var(--text);}
.ic-table{background:rgba(95,212,214,.14);color:var(--cyan);}
.ic-quiz{background:rgba(255,107,107,.13);color:#ff6b6b;}
.ic-text{background:rgba(111,209,140,.13);color:#6fd18c;}
.ic-diagram{background:rgba(52,211,153,.15);color:#34d399;}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-left">
    <div class="tb-logo">
      <svg viewBox="0 0 100 60" fill="none"><path d="M2 21h44l16 18h36v-7H65.5L49.5 14H2z" fill="currentColor"/><path d="M68 39h16l16-18H84z" fill="currentColor"/></svg>
      <span class="tb-logo-text">Neuronix</span>
    </div>
    <span class="tb-title" id="lessonTitleBar">Lesson Builder</span>
  </div>
  <div class="tb-right">
    <div class="lang-toggle">
      <button class="lt-btn active" id="ltEn" onclick="setLang('en')">EN</button>
      <button class="lt-btn kn" id="ltKn" onclick="setLang('kn')">ಕನ್ನಡ</button>
    </div>
    <a href="admin-curriculum.html" class="btn btn-outline">← Back</a>
    <button class="btn btn-danger" id="deleteLessonBtn" onclick="deleteLesson()" style="display:none;">🗑 Delete</button>
    <button class="btn btn-outline" onclick="saveLesson('draft')">Save Draft</button>
    <button class="btn btn-primary" onclick="saveLesson('published')">Publish</button>
  </div>
</header>
<div class="workspace">
  <aside class="palette">
    <div class="palette-title">Content Blocks</div>
    <div class="palette-hint">Drag a block onto the canvas, or click to add it to the end.</div>
    <div id="blockPalette"></div>
  </aside>
  <main class="canvas">
    <div class="canvas-inner">
      <div class="meta-card">
        <div class="fg">
          <label id="titleLabel">Lesson Title (EN) *</label>
          <input type="text" id="lessonTitle" class="fi" placeholder="e.g. Linear Algebra Intuition" oninput="syncTitle()">
        </div>
        <div class="fg">
          <label id="subtitleLabel">Subtitle (EN)</label>
          <input type="text" id="lessonSubtitle" class="fi" placeholder="One-line summary of the lesson">
        </div>
        <div class="meta-grid">
          <div class="fg"><label>Phase</label><select id="metaPhase" class="fs" onchange="loadModules()"><option value="">— Phase —</option></select></div>
          <div class="fg"><label>Module</label><select id="metaModule" class="fs"><option value="">— Module —</option></select></div>
        </div>
        <div class="meta-grid">
          <div class="fg"><label>Difficulty</label><select id="metaDifficulty" class="fs"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></div>
          <div class="fg"><label>Duration (mins)</label><input type="number" id="metaDuration" class="fi" placeholder="25" min="1" oninput="renderPreview()"></div>
        </div>
      </div>
      <div class="dropzone empty" id="dropzone">
        <div class="dz-icon">📚</div>
        <div class="dz-text">Drop content blocks here</div>
        <div class="dz-sub">or click a block on the left to add it</div>
      </div>
    </div>
  </main>
  <aside class="preview">
    <div class="preview-head">
      <span class="preview-label">Live Preview</span>
      <div class="lang-toggle">
        <button class="lt-btn active" id="pvEn" onclick="setPreviewLang('en')">EN</button>
        <button class="lt-btn kn" id="pvKn" onclick="setPreviewLang('kn')">ಕನ್ನಡ</button>
      </div>
    </div>
    <iframe class="preview-frame" id="previewFrame"></iframe>
  </aside>
</div>
<script src="/js/api.js"></script>
<script>
let lang='en', previewLang='en', blocks=[], blockCounter=0;
let blocksEn=[], blocksKn=[], lessonRaw=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Escape, then turn [label](url) and bare URLs into links. Newlines kept via CSS pre-wrap.
function rich(s){
  let h=esc(s);
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" class="lnk">$1</a>');
  h=h.replace(/(^|[^"'>=])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener" class="lnk">$2</a>');
  return h;
}
function lk(id,key){return `<button type="button" class="link-mini" onclick="insertLink('${id}','${key}')" title="Insert a link">\u{1F517} Link</button>`;}
function insertLink(id,key){
  const ta=document.getElementById('ta-'+id+'-'+key);if(!ta)return;
  const url=prompt('Link URL (https://\u2026):','https://');if(!url)return;
  const sel=ta.value.substring(ta.selectionStart,ta.selectionEnd)||'link text';
  const md='['+sel+']('+url+')';
  ta.value=ta.value.substring(0,ta.selectionStart)+md+ta.value.substring(ta.selectionEnd);
  setData(id,key,ta.value);ta.focus();
}

// Python syntax highlighter — produces the same colored spans as the home page
function highlightPython(code){
  const KEYWORDS=['def','class','return','import','from','for','while','if','elif','else','in','not','and','or','is','None','True','False','lambda','with','as','try','except','finally','raise','yield','assert','break','continue','pass','global','nonlocal','del','async','await'];
  const BUILTINS=['print','len','range','sum','zip','enumerate','list','dict','set','tuple','int','float','str','bool','abs','min','max','sorted','map','filter','open','super','isinstance','type','self'];
  // tokenize line by line, protect strings & comments first
  const lines=esc(code).split('\n');
  return lines.map(line=>{
    // comment
    const cmIdx=findComment(line);
    let codePart=line, comment='';
    if(cmIdx>-1){ codePart=line.slice(0,cmIdx); comment='<span class="cm">'+line.slice(cmIdx)+'</span>'; }
    // strings (single/double, including f-strings)
    const parts=[]; let i=0;
    const strRe=/(f?&quot;[^&]*?&quot;|f?&#039;[^&]*?&#039;|f?"[^"]*?"|f?'[^']*?')/g;
    // simpler: split on quote spans
    codePart=codePart.replace(/(f?(?:&quot;|&#039;|"|').*?(?:&quot;|&#039;|"|'))/g, m=>`\x00STR\x00${m}\x00/STR\x00`);
    // numbers
    codePart=codePart.replace(/\b(\d+\.?\d*)\b/g,'\x00NUM\x00$1\x00/NUM\x00');
    // keywords & builtins (only outside protected zones)
    codePart=codePart.split(/(\x00STR\x00.*?\x00\/STR\x00)/).map(seg=>{
      if(seg.startsWith('\x00STR\x00'))return seg;
      // keyword
      KEYWORDS.forEach(kw=>{ seg=seg.replace(new RegExp('\\b'+kw+'\\b','g'),`\x00KW\x00${kw}\x00/KW\x00`); });
      // builtin/function names
      BUILTINS.forEach(fn=>{ seg=seg.replace(new RegExp('\\b'+fn+'\\b','g'),`\x00FN\x00${fn}\x00/FN\x00`); });
      // function calls: word followed by (
      seg=seg.replace(/\b([a-zA-Z_]\w*)(\s*\()/g,(m,name,paren)=>{
        if(name.includes('\x00'))return m;
        return `\x00FN\x00${name}\x00/FN\x00${paren}`;
      });
      return seg;
    }).join('');
    // convert markers to spans
    codePart=codePart
      .replace(/\x00KW\x00/g,'<span class="kw">').replace(/\x00\/KW\x00/g,'</span>')
      .replace(/\x00FN\x00/g,'<span class="fn">').replace(/\x00\/FN\x00/g,'</span>')
      .replace(/\x00NUM\x00/g,'<span class="nm">').replace(/\x00\/NUM\x00/g,'</span>')
      .replace(/\x00STR\x00/g,'<span class="st">').replace(/\x00\/STR\x00/g,'</span>');
    return codePart+comment;
  }).join('\n');
}
function findComment(line){
  // find # not inside a string
  let inS=false, q='';
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inS){ if(ch===q)inS=false; continue; }
    if(ch==='"'||ch==="'"){ inS=true; q=ch; continue; }
    if(ch==='#')return i;
  }
  return -1;
}
const BLOCK_TYPES={
  problem:{name:'Problem',icon:'📌',cls:'ic-prob',desc:'Why this matters'},
  math:{name:'Math Derivation',icon:'📐',cls:'ic-math',desc:'Formula + explanation'},
  concept:{name:'Concept',icon:'💡',cls:'ic-concept',desc:'Heading + body + pills'},
  code:{name:'Code Block',icon:'💻',cls:'ic-code',desc:'Filename + code'},
  output:{name:'Expected Output',icon:'✅',cls:'ic-output',desc:'What the code prints'},
  method:{name:'Method Reference',icon:'📑',cls:'ic-method',desc:'API method cards'},
  example:{name:'Real-World Example',icon:'🌍',cls:'ic-example',desc:'Applied use case'},
  artifact:{name:'Reusable Artifact',icon:'🎁',cls:'ic-artifact',desc:'Prompt / skill / agent'},
  links:{name:'Links',icon:'🔗',cls:'ic-links',desc:'Heading + useful links'},
  heading:{name:'Heading',icon:'🔤',cls:'ic-heading',desc:'Section heading / divider'},
  table:{name:'Table',icon:'📊',cls:'ic-table',desc:'Structured data table'},
  quiz:{name:'Quiz',icon:'❓',cls:'ic-quiz',desc:'Multiple-choice questions'},
  text:{name:'Text Block',icon:'📝',cls:'ic-text',desc:'Heading + description'},
  diagram:{name:'Diagram',icon:'🖼️',cls:'ic-diagram',desc:'Inline SVG diagram'},
};
function renderPalette(){
  const pal=document.getElementById('blockPalette');pal.innerHTML='';
  Object.entries(BLOCK_TYPES).forEach(([type,def])=>{
    const card=document.createElement('div');card.className='block-card';card.draggable=true;card.dataset.type=type;
    card.innerHTML=`<div class="bc-icon ${def.cls}">${def.icon}</div><div class="bc-body"><div class="bc-name">${def.name}</div><div class="bc-desc">${def.desc}</div></div>`;
    card.addEventListener('click',()=>addBlock(type));
    card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/block-type',type);card.classList.add('dragging');});
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    pal.appendChild(card);
  });
}
function addBlock(type,atIndex){
  blockCounter++;const block={id:'b'+blockCounter,type,data:{}};
  if(atIndex!=null)blocks.splice(atIndex,0,block);else blocks.push(block);
  renderBlocks();renderPreview();backupDraft();
}
function removeBlock(id){blocks=blocks.filter(b=>b.id!==id);renderBlocks();renderPreview();backupDraft();}
function moveBlock(id,dir){
  const i=blocks.findIndex(b=>b.id===id);if(i<0)return;const j=i+dir;if(j<0||j>=blocks.length)return;
  [blocks[i],blocks[j]]=[blocks[j],blocks[i]];renderBlocks();renderPreview();backupDraft();
}
let dragTarget=null;
function clearDropIndicators(){document.querySelectorAll('.lblock').forEach(b=>b.classList.remove('drop-before','drop-after'));}
function renderBlocks(){
  const dz=document.getElementById('dropzone');
  if(!blocks.length){dz.className='dropzone empty';dz.innerHTML=`<div class="dz-icon">📚</div><div class="dz-text">Drop content blocks here</div><div class="dz-sub">or click a block on the left to add it</div>`;return;}
  dz.className='dropzone';dz.innerHTML='';
  blocks.forEach(block=>{
    const def=BLOCK_TYPES[block.type]||{cls:'widget',icon:'⚙',name:block.type};const el=document.createElement('div');el.className='lblock';el.dataset.id=block.id;
    el.innerHTML=`<div class="lblock-head" draggable="true"><span class="drag-handle">⠿</span><div class="lblock-icon ${def.cls}">${def.icon}</div><span class="lblock-name">${def.name}</span><div class="lblock-actions"><button class="lblock-btn" onclick="moveBlock('${block.id}',-1)" title="Up">▲</button><button class="lblock-btn" onclick="moveBlock('${block.id}',1)" title="Down">▼</button><button class="lblock-btn del" onclick="removeBlock('${block.id}')" title="Remove">✕</button></div></div><div class="lblock-body">${blockFields(block)}</div>`;
    const head=el.querySelector('.lblock-head');
    head.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/reorder-id',block.id);el.classList.add('dragging');});
    head.addEventListener('dragend',()=>{el.classList.remove('dragging');clearDropIndicators();dragTarget=null;});
    el.addEventListener('dragover',e=>{
      e.preventDefault();e.stopPropagation();
      dz.classList.remove('dragover');
      clearDropIndicators();
      const rect=el.getBoundingClientRect();
      const pos=e.clientY<rect.top+rect.height/2?'before':'after';
      el.classList.add('drop-'+pos);
      dragTarget={id:block.id,pos};
    });
    el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget)){el.classList.remove('drop-before','drop-after');}});
    dz.appendChild(el);
  });
}
function blockFields(block){
  const d=block.data,id=block.id;
  const knCls=lang==='kn'?' kn':'';const suffix=lang==='kn'?'Kn':'En';
  const v=(k)=>esc(d[k+suffix]||'');const label=lang==='kn'?'(ಕನ್ನಡ)':'(EN)';
  switch(block.type){
    case 'problem':return `<div class="fg"><div class="fg-row"><label>Problem Statement ${label}</label>${lk(id,'problem'+suffix)}</div><textarea class="ft${knCls}" id="ta-${id}-problem${suffix}" oninput="setData('${id}','problem${suffix}',this.value)" placeholder="What problem does this solve?">${v('problem')}</textarea></div>`;
    case 'math':return `<div class="fg"><label>Formula</label><textarea class="ft code" oninput="setData('${id}','formula',this.value)" placeholder="dot(a,b) = Σ aᵢ × bᵢ">${esc(d.formula||'')}</textarea></div><div class="fg"><label>Explanation ${label}</label><textarea class="ft${knCls}" oninput="setData('${id}','desc${suffix}',this.value)" placeholder="What it means in words">${v('desc')}</textarea></div>`;

function quizFields(block){
  const d=block.data;if(!d.questions)d.questions=[{q:'',opts:['','','',''],qKn:'',optsKn:['','','',''],correct:0}];
  const knMode=lang==='kn';
  const qKey=knMode?'qKn':'q',optsKey=knMode?'optsKn':'opts';
  const qLabel=knMode?'Question text (ಕನ್ನಡ)':'Question text';
  let html='';
  d.questions.forEach((q,qi)=>{
    if(!q.optsKn)q.optsKn=['','','',''];
    const opts=knMode?q.optsKn:q.opts;
    html+=`<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.7rem;margin-bottom:.5rem;"><div style="display:flex;justify-content:space-between;margin-bottom:.5rem;"><span class="mini-label">Question ${qi+1}</span><button class="lblock-btn del" style="width:22px;height:22px;" onclick="removeQuizQ('${block.id}',${qi})">✕</button></div><input class="fi${knMode?' kn':''}" style="margin-bottom:.4rem;" placeholder="${qLabel}" value="${esc(q[qKey]||'')}" oninput="setQuizQ('${block.id}',${qi},'${qKey}',this.value)">${q.opts.map((_,oi)=>`<div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;"><input type="radio" name="correct-${block.id}-${qi}" ${q.correct===oi?'checked':''} onchange="setQuizQ('${block.id}',${qi},'correct',${oi})" style="accent-color:var(--cyan);"><input class="fi${knMode?' kn':''}" style="flex:1;" placeholder="Option ${String.fromCharCode(65+oi)}${knMode?' (ಕನ್ನಡ)':''}" value="${esc(opts[oi]||'')}" oninput="setQuizOpt('${block.id}',${qi},${oi},this.value)"></div>`).join('')}</div>`;
  });
  html+=`<button class="btn btn-outline" style="font-size:.76rem;padding:.35rem .8rem;margin-top:.3rem;" onclick="addQuizQ('${block.id}')">+ Add Question</button>`;
  return `<div id="quiz-panel-${block.id}">${html}</div>`;
}
function refreshQuizPanel(id){
  const b=blocks.find(x=>x.id===id);if(!b)return;
  const panel=document.getElementById('quiz-panel-'+id);
  if(panel){panel.outerHTML=quizFields(b);}else{renderBlocks();}
  renderPreview();backupDraft();
}
function setData(id,key,value){const b=blocks.find(x=>x.id===id);if(b){b.data[key]=value;renderPreview();backupDraft();}}
function setQuizQ(id,qi,key,value){const b=blocks.find(x=>x.id===id);if(b){b.data.questions[qi][key]=value;renderPreview();}}
function setQuizOpt(id,qi,oi,value){const b=blocks.find(x=>x.id===id);if(b){const q=b.data.questions[qi];const knMode=lang==='kn';if(knMode){if(!q.optsKn)q.optsKn=['','','',''];q.optsKn[oi]=value;}else{q.opts[oi]=value;}renderPreview();}}
function addQuizQ(id){const b=blocks.find(x=>x.id===id);if(b){b.data.questions.push({q:'',opts:['','','',''],qKn:'',optsKn:['','','',''],correct:0});refreshQuizPanel(id);}}
function removeQuizQ(id,qi){const b=blocks.find(x=>x.id===id);if(b&&b.data.questions.length>1){b.data.questions.splice(qi,1);refreshQuizPanel(id);}}
const dz=document.getElementById('dropzone');
dz.addEventListener('dragover',e=>{e.preventDefault();if(!dragTarget)dz.classList.add('dragover');});
dz.addEventListener('dragleave',e=>{if(!dz.contains(e.relatedTarget)){dz.classList.remove('dragover');clearDropIndicators();dragTarget=null;}});
dz.addEventListener('drop',e=>{
  e.preventDefault();dz.classList.remove('dragover');clearDropIndicators();
  const newType=e.dataTransfer.getData('text/block-type');
  const reorderId=e.dataTransfer.getData('text/reorder-id');
  if(newType){
    if(dragTarget){
      const toIdx=blocks.findIndex(b=>b.id===dragTarget.id);
      addBlock(newType,dragTarget.pos==='before'?toIdx:toIdx+1);
    } else {addBlock(newType);}
  } else if(reorderId){
    const fromIdx=blocks.findIndex(b=>b.id===reorderId);
    if(fromIdx<0){dragTarget=null;return;}
    if(dragTarget&&dragTarget.id!==reorderId){
      const[b]=blocks.splice(fromIdx,1);
      let toIdx=blocks.findIndex(b2=>b2.id===dragTarget.id);
      if(dragTarget.pos==='after')toIdx+=1;
      blocks.splice(toIdx,0,b);
    } else if(!dragTarget){
      const[b]=blocks.splice(fromIdx,1);blocks.push(b);
    }
    renderBlocks();renderPreview();backupDraft();
  }
  dragTarget=null;
});
function setLang(l){
  // Persist current edits back to the right cache before switching
  if(lang==='kn') blocksKn=blocks.slice(); else blocksEn=blocks.slice();

  lang=l;
  document.getElementById('ltEn').classList.toggle('active',l==='en');
  document.getElementById('ltKn').classList.toggle('active',l==='kn');
  document.getElementById('titleLabel').textContent=l==='kn'?'Lesson Title (ಕನ್ನಡ) *':'Lesson Title (EN) *';
  document.getElementById('subtitleLabel').textContent=l==='kn'?'Subtitle (ಕನ್ನಡ)':'Subtitle (EN)';
  const ti=document.getElementById('lessonTitle'),su=document.getElementById('lessonSubtitle');
  ti.classList.toggle('kn',l==='kn');su.classList.toggle('kn',l==='kn');
  ti.value=l==='kn'?(lessonData.titleKn||''):(lessonData.titleEn||'');
  su.value=l==='kn'?(lessonData.subtitleKn||''):(lessonData.subtitleEn||'');

  // Swap to the matching block set
  const targetBlocks = l==='kn' ? blocksKn : blocksEn;
  if(targetBlocks.length){
    blocks=targetBlocks.slice();
    blockCounter=blocks.reduce((m,b)=>{const n=parseInt((b.id||'b0').replace(/\D/g,''))||0;return n>m?n:m;},0);
  }
  renderBlocks();
}

let phasesCache=[];

function loadModules(){

// ── Local draft backup (survives even if the server round-trip fails) ──
function currentLessonId(){return new URLSearchParams(location.search).get('id')||'new';}
function lsKey(id){return 'pnl_draft_'+(id||currentLessonId());}
function backupDraft(){
  try{
    const snap={lessonData,blocks,ts:Date.now()};
    localStorage.setItem(lsKey(),JSON.stringify(snap));
  }catch(e){/* storage full or unavailable */}
}
function readBackup(id){
  try{const raw=localStorage.getItem(lsKey(id));return raw?JSON.parse(raw):null;}catch(e){return null;}
}

function applySnapshot(snap){
  if(snap.lessonData)Object.assign(lessonData,snap.lessonData);
  if(Array.isArray(snap.blocks)){blocks=snap.blocks;blockCounter=blocks.reduce((m,b)=>{const n=b.id&&parseInt(b.id.replace('b',''));return n>m?n:m;},0)||blocks.length;}

  document.getElementById('lessonSubtitle').value=lessonData.subtitleEn||'';
  document.getElementById('lessonTitleBar').textContent=lessonData.titleEn||'Lesson Builder';

// Auto-backup every 15s as a safety net.
setInterval(backupDraft,15000);

function buildPayload(status){
  // Sync current edits into the right cache first
  if(lang==='kn') blocksKn=blocks.slice(); else blocksEn=blocks.slice();
  const enBuilder = blocksEn.length ? JSON.stringify({lessonData,blocks:blocksEn}) : (lessonRaw&&lessonRaw.builderEn)||'';
  const knBuilder = blocksKn.length ? JSON.stringify({blocks:blocksKn}) : (lessonRaw&&lessonRaw.builderKn)||'';
  return{title:lessonData.titleEn,titleKn:lessonData.titleKn,desc:lessonData.subtitleEn,phaseId:document.getElementById('metaPhase').value||undefined,moduleId:document.getElementById('metaModule').value||undefined,difficulty:document.getElementById('metaDifficulty').value,duration:parseInt(document.getElementById('metaDuration').value)||0,status,builderEn:enBuilder,builderKn:knBuilder};
}
function adminTokenPresent(){try{return !!localStorage.getItem('pnl_token');}catch(e){return false;}}
function apiBaseLabel(){try{return (typeof API_BASE!=='undefined'&&API_BASE)?API_BASE:'the API URL';}catch(e){return 'the API URL';}}

async function saveLesson(status){
  if(!lessonData.titleEn&&!lessonData.titleKn){alert('Please enter a lesson title.');return;}
  backupDraft(); // never lose work, no matter what happens next
  if(status==='published'&&!document.getElementById('metaPhase').value){alert('Please choose a Phase before publishing.');return;}

  // 1) Must be signed in as admin — writes require a valid admin token.
  if(!adminTokenPresent()){
    if(confirm('You are not signed in as an admin, so the server will reject the save.\n\nOpen the admin login now? Your draft is saved in this browser and will be restored when you return.')){
      window.location.href='admin-login.html';
    }
    return;
  }

  let lessonId=new URLSearchParams(location.search).get('id');
  const payload=buildPayload(status);

  // 2) Send the create/update request, with precise error messages.
  let res;
  try{
    res = lessonId ? await api.put('/api/curriculum/lessons/'+lessonId,payload)
                   : await api.post('/api/curriculum/lessons',payload);
  }catch(e){
    const msg=String((e&&e.message)||'');
    if(/token|admin access|401|403/i.test(msg)){
      if(confirm('Your admin session has expired, so the server rejected the save.\n\nLog in again now? Your draft is safe in this browser.')){window.location.href='admin-login.html';}
      return;
    }
    if(/reach the server|failed to fetch|networkerror|load failed/i.test(msg)){
      alert('Could not reach the backend at '+apiBaseLabel()+'.\n\nMake sure the backend server is running (npm run dev / node server.js), then try again. Your draft is saved in this browser.');
      return;
    }
    alert('Save failed: '+msg+'\n\nYour draft is saved in this browser and will be restored.');
    return;
  }

  // 3) Capture the new id so further saves update (not duplicate) this lesson.
  const savedItem=res&&(res.item||res.lesson);
  const newId=savedItem&&(savedItem._id||savedItem.id);
  if(!lessonId&&newId){
    lessonId=newId;
    try{sessionStorage.setItem('pnl_open_lesson',String(newId));}catch(e){}
    const u=new URL(location.href);u.searchParams.set('id',newId);history.replaceState(null,'',u);
    const delBtn=document.getElementById('deleteLessonBtn');if(delBtn)delBtn.style.display='inline-flex';
    try{const snap=localStorage.getItem('pnl_draft_new');if(snap){localStorage.setItem('pnl_draft_'+newId,snap);localStorage.removeItem('pnl_draft_new');}}catch(e){}
  }

  // 4) Save any quiz blocks (non-critical — never blocks the draft).
  try{
    for(const qb of blocks.filter(b=>b.type==='quiz')){
      const questions=(qb.data.questions||[]).filter(q=>q.q).map(q=>({question:q.q,options:q.opts,correct:q.correct}));
      if(questions.length){await api.post('/api/curriculum/quizzes',{title:(lessonData.titleEn||'Lesson')+' Quiz',questions,status,phaseId:document.getElementById('metaPhase').value||undefined,moduleId:document.getElementById('metaModule').value||undefined,...(lessonId&&{lessonId})});}
    }
  }catch(e){/* quiz save failure does not affect the lesson draft */}

  // 5) VERIFY: read the lesson back and confirm the builder content actually persisted.
  let verifiedBlocks=null;
  try{
    const check=await api.get('/api/curriculum/lessons/'+lessonId);
    const cl=check.lesson||check;
    const raw=cl.builderEn||cl.contentEn||'';
    if(raw){try{const p=JSON.parse(raw);if(p&&Array.isArray(p.blocks))verifiedBlocks=p.blocks.length;}catch(e){}}
  }catch(e){/* verification GET failed; fall through to the warning */}

  if(verifiedBlocks!=null){
    // Confirmed stored on the server — the local backup is no longer needed.
    clearBackup(lessonId);clearBackup('new');
    if(status==='published'){alert('Lesson published \u2713');window.location.href='admin-curriculum.html';}
    else{alert('Draft saved \u2713  ('+verifiedBlocks+' block'+(verifiedBlocks===1?'':'s')+' stored on the server)');}
  }else{
    alert('The save request succeeded, but reading the lesson back showed NO stored builder content.\n\nThis means your backend is running an OLD models/Curriculum.js. Replace it with the updated file (it adds the builderEn field) and RESTART the backend, then save again.\n\nYour work is safe in this browser and will be restored automatically.');
  }
}
async function deleteLesson(){
  const lessonId=new URLSearchParams(location.search).get('id');
  if(!lessonId){alert('This lesson has not been saved yet, so there is nothing to delete.');return;}
  const name=lessonData.titleEn||lessonData.titleKn||'this lesson';
  if(!confirm('Delete \u201C'+name+'\u201D? This permanently removes the lesson and cannot be undone.'))return;
  try{
    await api.delete('/api/curriculum/lessons/'+lessonId);
    alert('Lesson deleted.');
    window.location.href='admin-curriculum.html';
  }catch(e){alert('Could not delete: '+e.message);}
}
async function loadLesson(id){
  try{
    const res=await api.get('/api/curriculum/lessons/'+id);const l=res.lesson||res;
    const delBtn=document.getElementById('deleteLessonBtn');if(delBtn)delBtn.style.display='inline-flex';
    lessonData.titleEn=l.title||'';lessonData.titleKn=l.titleKn||'';lessonData.subtitleEn=l.desc||'';
    document.getElementById('lessonTitle').value=lessonData.titleEn;
    document.getElementById('lessonSubtitle').value=lessonData.subtitleEn;
    document.getElementById('lessonTitleBar').textContent=lessonData.titleEn||'Lesson Builder';
    document.getElementById('metaDifficulty').value=l.difficulty||'beginner';
    document.getElementById('metaDuration').value=l.duration||'';
    // ── Figure out what to load into the builder ──
    let loadedBlocks=null, loadedMeta=null;
    const isJson=s=>typeof s==='string'&&(s.trim().startsWith('{')||s.trim().startsWith('['));
    // 1) Prefer the dedicated builder field; fall back to contentEn IF it holds builder JSON.
    for(const raw of [l.builderEn, l.contentEn]){
      if(isJson(raw)){
        try{const parsed=JSON.parse(raw);
          if(parsed&&Array.isArray(parsed.blocks)&&parsed.blocks.length){loadedBlocks=parsed.blocks;loadedMeta=parsed.lessonData||null;break;}
          else if(Array.isArray(parsed)&&parsed.length){loadedBlocks=parsed;loadedMeta=null;break;}
        }catch(e){/* not builder json, keep looking */}
      }
    }
    // 2) No builder blocks, but the lesson has plain text/markdown (Quick Add or seeded)?
    //    Wrap it in a Concept block so the content is visible & editable instead of a blank canvas.
    if(!loadedBlocks){
      const enText=(l.contentEn&&!isJson(l.contentEn))?l.contentEn:(l.content&&!isJson(l.content)?l.content:'');
      const knText=(l.contentKn&&!isJson(l.contentKn))?l.contentKn:'';
      if(enText||knText){
        loadedBlocks=[{id:'b1',type:'concept',data:{headingEn:l.title||'',headingKn:l.titleKn||'',bodyEn:enText,bodyKn:knText}}];
      }
    }
    let serverHadBlocks=false;
    if(loadedBlocks&&loadedBlocks.length){
      // Assign ids to any blocks that are missing them (created by backend scripts)
      let _maxN=0;
      blocks=loadedBlocks.map(b=>{
        if(b.id){const n=parseInt((b.id).replace(/\D/g,''))||0;if(n>_maxN)_maxN=n;return b;}
        _maxN++;return{...b,id:'b'+_maxN};
      });
      blockCounter=_maxN;serverHadBlocks=true;
    }
    // Cache the raw lesson and both block sets for lang-switching
    lessonRaw=l;
    blocksEn=blocks.slice();
    blocksKn=[];
    if(l.builderKn){try{const kp=JSON.parse(l.builderKn);
      let kpArr=null;
      if(kp&&Array.isArray(kp.blocks)&&kp.blocks.length)kpArr=kp.blocks;
      else if(Array.isArray(kp)&&kp.length)kpArr=kp;
      if(kpArr){let _ki=0;blocksKn=kpArr.map(b=>b.id?b:{...b,id:'bk'+(++_ki)});}
    }catch(e){}}
    if(loadedMeta){Object.assign(lessonData,loadedMeta);document.getElementById('lessonTitle').value=lessonData.titleEn||'';document.getElementById('lessonSubtitle').value=lessonData.subtitleEn||'';}
    console.log('[loadLesson] id=',id,'title=',l.title,'builderEn?',!!l.builderEn,'loadedBlocks=',loadedBlocks?loadedBlocks.length:0);
    // 3) Still nothing on the server — offer to restore an unsaved local backup.
    if(!serverHadBlocks){
      const backup=readBackup(id);
      if(backup&&Array.isArray(backup.blocks)&&backup.blocks.length){
        if(confirm('This lesson has no saved content on the server, but an unsaved draft was found in this browser ('+backup.blocks.length+' block(s)). Restore it?')){
          applySnapshot(backup);
          renderBlocks();renderPreview();
          return;
        }
      }
      // Tell the user plainly which lesson opened and that it has no blocks,
      // so an accidentally-opened empty lesson is never mistaken for lost work.
      alert('Opened \u201C'+(l.title||'this lesson')+'\u201D, but it has no saved content blocks yet.\n\nIf you expected blocks here, you may have opened a different lesson from the list. Lessons you saved with the Rich Editor will reopen with their blocks.');
    }
    renderBlocks();renderPreview();
  }catch(e){
    console.warn('loadLesson failed:',e&&e.message);
    alert('Could not load this lesson: '+((e&&e.message)||'unknown error')+'\n\nMake sure the backend is running and you are logged in as admin.');
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  renderPalette();renderBlocks();renderPreview();loadPhases();
  // The id may be in the query string, OR (on clean-URL hosts that drop the query)
  // in sessionStorage, set by the lessons list before navigating here.
  let lessonId=new URLSearchParams(location.search).get('id');
  if(!lessonId){try{lessonId=sessionStorage.getItem('pnl_open_lesson')||'';}catch(e){}}
  if(lessonId){
    try{sessionStorage.setItem('pnl_open_lesson',String(lessonId));}catch(e){} // keep for refresh
    loadLesson(lessonId);
  }else{
    try{sessionStorage.removeItem('pnl_open_lesson');}catch(e){} // brand-new lesson
    const backup=readBackup('new');if(backup&&Array.isArray(backup.blocks)&&backup.blocks.length){if(confirm('An unsaved draft was found in this browser ('+backup.blocks.length+' block(s)). Continue editing it?')){applySnapshot(backup);}else{clearBackup('new');}}
  }
});
